<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단어장</title>
<style>
:root {
  --bg: #f1f3f4;
  --surface: #ffffff;
  --text: #202124;
  --muted: #5f6368;
  --border: #dadce0;
  --accent: #1a73e8;
  --accent-bg: #e8f0fe;
  --danger: #d93025;
  --shadow: 0 1px 3px rgba(60,64,67,.25);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #202124; --surface: #202124; --text: #e8eaed; --muted: #9aa0a6;
    --border: #5f6368; --accent: #8ab4f8; --accent-bg: #394457; --danger: #f28b82;
    --shadow: 0 1px 3px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #202124; --surface: #202124; --text: #e8eaed; --muted: #9aa0a6;
  --border: #5f6368; --accent: #8ab4f8; --accent-bg: #394457; --danger: #f28b82;
  --shadow: 0 1px 3px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Malgun Gothic", sans-serif;
  min-height: 100vh;
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding: 10px 12px 10px;
  display: flex; gap: 8px; align-items: center;
}
.search {
  flex: 1; min-width: 0; height: 48px; border: none; border-radius: 24px;
  background: #fff; color: #202124; padding: 0 20px; font-size: 16px;
  box-shadow: var(--shadow); outline: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .search { background: #2d2e31; color: #e8eaed; }
}
.search::placeholder { color: var(--muted); }
select {
  height: 48px; border: none; border-radius: 24px; background: #fff; color: #202124;
  padding: 0 10px; font-size: 14px; box-shadow: var(--shadow); max-width: 112px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) select { background: #2d2e31; color: #e8eaed; }
}
main { padding: 6px 12px 110px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; align-items: start; }
.card {
  display: block; width: 100%; text-align: left;
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px 16px 16px; cursor: pointer;
  font: inherit; line-height: 1.5;
}
.card h3 { margin: 0 0 14px; font-size: 20px; font-weight: 600; word-break: break-word; }
.card h3:empty { display: none; }
.card .body {
  font-size: 14px; white-space: pre-wrap; word-break: break-word;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 12; line-clamp: 12;
  overflow: hidden;
}
.empty { text-align: center; color: var(--muted); padding: 60px 20px; line-height: 1.8; white-space: pre-line; }
.fab {
  position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: 58px; height: 58px; border-radius: 18px; border: none;
  background: var(--accent-bg); color: var(--accent); font-size: 34px; line-height: 1;
  box-shadow: 0 3px 8px rgba(0,0,0,.35); cursor: pointer;
}
dialog {
  border: none; padding: 0; margin: 0; width: 100vw; max-width: 100vw;
  height: 100vh; height: 100dvh; max-height: none;
  background: var(--surface); color: var(--text);
}
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: transparent; }
.bar {
  display: flex; align-items: center; gap: 4px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 8px 8px;
}
.bar .sp { flex: 1; }
.icon {
  border: none; background: transparent; color: var(--text); cursor: pointer;
  width: 44px; height: 44px; border-radius: 50%; font-size: 24px; line-height: 1;
}
.icon.danger { color: var(--danger); font-size: 15px; width: auto; padding: 0 12px; border-radius: 22px; }
.edit {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 4px 20px calc(24px + env(safe-area-inset-bottom, 0px));
}
.edit input, .edit textarea {
  display: block; width: 100%; border: none; background: transparent; color: var(--text);
  font: inherit; outline: none; padding: 6px 0; border-radius: 0;
}
.edit input { font-size: 27px; font-weight: 600; margin-bottom: 6px; }
.edit textarea { font-size: 17px; line-height: 1.6; min-height: 60vh; resize: none; overflow: hidden; }
.err { color: var(--danger); font-size: 13px; min-height: 16px; padding: 0 20px; }
</style>
</head>
<body>
<header>
  <input id="q" class="search" type="search" placeholder="검색" autocomplete="off">
  <select id="sort" aria-label="정렬">
    <option value="az">이름순</option>
    <option value="za">이름 역순</option>
    <option value="created">만든 순</option>
    <option value="updated">수정 순</option>
  </select>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</main>
<button class="fab" id="add" aria-label="새 메모">+</button>

<dialog id="dlg">
  <div class="bar">
    <button class="icon" id="back" type="button" aria-label="저장하고 닫기">&#8592;</button>
    <span class="sp"></span>
    <button class="icon danger" id="del" type="button">삭제</button>
  </div>
  <div class="err" id="err"></div>
  <div class="edit" id="edit">
    <input id="f-title" placeholder="제목" autocomplete="off" autocapitalize="none">
    <textarea id="f-body" placeholder="메모 입력"></textarea>
  </div>
</dialog>

<script>
(function () {
  var words = [];
  var mode = 'init';
  var col = null;
  var editingId = null;
  var delArmed = false;
  var LS_KEY = 'vocab-words-v2';

  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid'), emptyEl = $('empty');
  var dlg = $('dlg');

  function lsRead() {
    try { var v = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(words)); } catch (e) {} }
  function newId() { return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  async function saveWord(w) {
    if (mode === 'db') {
      await col.doc(w.id).set({ title: w.title, body: w.body, created: w.created, updated: w.updated });
    } else {
      var i = words.findIndex(function (x) { return x.id === w.id; });
      if (i >= 0) words[i] = w; else words.push(w);
      lsWrite(); render();
    }
  }
  async function removeWord(id) {
    if (mode === 'db') { await col.doc(id).delete(); }
    else { words = words.filter(function (x) { return x.id !== id; }); lsWrite(); render(); }
  }

  async function init() {
    render();
    var ok = false;
    try {
      if (window.claude && claude.use) {
        var db = await claude.use('db');
        var user = await claude.use('user');
        var uid = user ? await user.id() : null;
        if (db && uid) {
          col = db.collection('data/users/' + uid);
          mode = 'db';
          ok = true;
          col.onSnapshot(function (snap) {
            words = snap.docs.map(function (d) {
              var x = d.data() || {};
              var body = x.body;
              if (body == null) body = [x.e, x.m, x.s].filter(Boolean).join('\n\n');
              return { id: d.id, title: x.title || '', body: body || '',
                       created: x.created || 0, updated: x.updated || 0 };
            });
            render();
          }, function () { mode = 'local'; words = lsRead(); render(); });
        }
      }
    } catch (e) { ok = false; }
    if (!ok) { mode = 'local'; words = lsRead(); render(); }
  }

  function sorted(list) {
    var cmp = {
      az: function (a, b) { return a.title.toLowerCase().localeCompare(b.title.toLowerCase(), 'en'); },
      za: function (a, b) { return b.title.toLowerCase().localeCompare(a.title.toLowerCase(), 'en'); },
      created: function (a, b) { return (a.created || 0) - (b.created || 0); },
      updated: function (a, b) { return (b.updated || 0) - (a.updated || 0); }
    }[$('sort').value];
    return list.slice().sort(cmp);
  }

  function matches(w, q) {
    if (!q) return true;
    return (w.title + '\n' + w.body).toLowerCase().indexOf(q.toLowerCase()) >= 0;
  }

  function cardFor(w) {
    var c = document.createElement('button');
    c.type = 'button'; c.className = 'card';
    var h = document.createElement('h3'); h.textContent = w.title; c.appendChild(h);
    var b = document.createElement('div'); b.className = 'body'; b.textContent = w.body; c.appendChild(b);
    c.addEventListener('click', function () { openEditor(w); });
    return c;
  }

  function render() {
    var q = $('q').value.trim();
    var list = sorted(words.filter(function (w) { return matches(w, q); }));
    grid.textContent = '';
    list.forEach(function (w) { grid.appendChild(cardFor(w)); });
    if (!list.length) {
      emptyEl.hidden = false;
      emptyEl.textContent = words.length ? '검색 결과가 없습니다.' : '메모가 없습니다.\n오른쪽 아래 + 버튼으로 추가하세요.';
    } else { emptyEl.hidden = true; }
  }

  function grow() {
    var t = $('f-body');
    t.style.height = 'auto';
    t.style.height = Math.max(t.scrollHeight, Math.round(window.innerHeight * 0.6)) + 'px';
  }

  function openEditor(w) {
    editingId = w ? w.id : null;
    $('f-title').value = w ? w.title : '';
    $('f-body').value = w ? w.body : '';
    $('err').textContent = '';
    delArmed = false;
    $('del').textContent = '삭제';
    $('del').style.visibility = w ? 'visible' : 'hidden';
    dlg.showModal();
    $('edit').scrollTop = 0;
    grow();
    if (!w) $('f-title').focus();
  }

  async function saveAndClose() {
    var title = $('f-title').value.trim();
    var body = $('f-body').value.replace(/\s+$/, '');
    if (!title && !body) { dlg.close(); return; }
    if (!title) { $('err').textContent = '제목(단어)을 입력해 주세요.'; $('f-title').focus(); return; }
    var now = Date.now();
    var old = editingId ? words.find(function (x) { return x.id === editingId; }) : null;
    var w = {
      id: old ? old.id : newId(),
      title: title,
      body: body,
      created: old ? (old.created || now) : now,
      updated: now
    };
    var changed = !old || old.title !== w.title || old.body !== w.body;
    if (!changed) { dlg.close(); return; }
    try { await saveWord(w); dlg.close(); }
    catch (e) { $('err').textContent = '저장하지 못했습니다. 다시 시도해 주세요.'; }
  }

  $('add').addEventListener('click', function () { openEditor(null); });
  $('back').addEventListener('click', saveAndClose);
  dlg.addEventListener('cancel', function (ev) { ev.preventDefault(); saveAndClose(); });
  $('f-body').addEventListener('input', grow);

  $('del').addEventListener('click', async function () {
    if (!editingId) return;
    if (!delArmed) { delArmed = true; $('del').textContent = '정말 삭제'; return; }
    try { await removeWord(editingId); dlg.close(); }
    catch (e) { $('err').textContent = '삭제하지 못했습니다. 다시 시도해 주세요.'; }
  });

  $('q').addEventListener('input', render);
  $('sort').addEventListener('change', function () {
    try { localStorage.setItem('vocab-sort', $('sort').value); } catch (e) {}
    render();
  });
  try {
    var s = localStorage.getItem('vocab-sort');
    if (s && ['az', 'za', 'created', 'updated'].indexOf(s) >= 0) $('sort').value = s;
  } catch (e) {}

  init();
})();
</script>
</body>
</html>
